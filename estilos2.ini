.sacola
{
    background-image: url(../image/sacola.png);
    background-repeat: no-repeat;
    background-position: top right;
    font-size: 14px;
    padding-right: 35px;
    text-align: right;
    width:  500px;
    padding-top: 8px;
    position: absolute;
    top: 0;
    right: 0;
}

.menu-opcoes
{
    position:   absolute;
    bottom: 0;
    right: 0;
} 

.menu-opcoes ul
{
    font-size:  15px;
}  

.menu-opcoes a
{
    color: #014069;
}

.menu-opcoes ul li
{
    display: inline;
    margin-left:20px;
}

body 
{
    color: #333333;
    font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
}

.container
{
    margin: 10px auto;
    width: 950px;
}

header
{
    position:  relative;
}

.busca,
.menu-departamentos
{
    background-color: #DCDCDC;
    font-weight:    bold;
    text-transform: uppercase;
    margin-right: 10px;
    width: 230px;
    float: left;
}

.busca h2,
.busca form,
.menu-departamentos h2
{
    margin: 10px;
}

.menu-departamentos li
{
    background-color: white;
    margin-bottom: 1px;
    padding: 5px 10px;
}

.menu-departamentos a
{
    color:#000000;
    text-decoration: none;
}

.busca input[type=search]
{
    width: 170px;
}

.menu-departamentos
{
    clear: left;
    margin-top: 10px;
    padding-bottom: 10px;
}

.destaque
{
    margin-top: 10px;
}